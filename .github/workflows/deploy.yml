name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd artifacts/folder-app
          PORT=3000 BASE_PATH=/ node_modules/.bin/vite build --config vite.config.ts

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd /tmp
          node $GITHUB_WORKSPACE/artifacts/folder-app/node_modules/.bin/wrangler \
            pages deploy $GITHUB_WORKSPACE/artifacts/folder-app/dist/public \
            --project-name=examly --branch=main
